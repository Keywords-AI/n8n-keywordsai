name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out n8n integration
        uses: actions/checkout@v4
        with:
          path: n8n-keywordsai

      - name: Check out Respan n8n instrumentation
        uses: actions/checkout@v4
        with:
          repository: Nightingalelyy/respan
          ref: 5769847d99f808ab3fb15814af97f2b794ccc1d6
          path: respan

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: n8n-keywordsai/package-lock.json

      - name: Install and build local Respan packages
        working-directory: respan/javascript-sdks
        run: |
          npx --yes @yarnpkg/cli-dist@4.9.2 install --immutable
          npx --yes @yarnpkg/cli-dist@4.9.2 workspace @respan/respan-sdk build
          npx --yes @yarnpkg/cli-dist@4.9.2 workspace @respan/tracing build
          npx --yes @yarnpkg/cli-dist@4.9.2 workspace @respan/instrumentation-n8n build

      - name: Install integration dependencies
        working-directory: n8n-keywordsai
        run: npm ci

      - name: Run tests
        working-directory: n8n-keywordsai
        run: npm test

      - name: Run lint
        working-directory: n8n-keywordsai
        run: npm run lint

      - name: Check package contents
        working-directory: n8n-keywordsai
        run: npm pack --dry-run
